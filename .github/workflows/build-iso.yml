name: Build Veyra OS Live ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'live-build/**'
      - 'branding/**'
      - '.github/workflows/build-iso.yml'

jobs:
  build:
    name: Build Debian Live ISO
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Debian Live Build Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            live-build \
            syslinux \
            syslinux-utils \
            isolinux \
            xorriso \
            squashfs-tools

      - name: Configure and Build Live ISO
        working-directory: live-build
        run: |
          chmod +x auto/*
          sudo lb clean --purge
          sudo lb config
          sudo lb build

      - name: Verify ISO Image Generation
        id: verify
        working-directory: live-build
        run: |
          ls -lh *.iso
          ISO_FILE=$(ls *.iso | head -n 1)
          if [ -z "$ISO_FILE" ]; then
            echo "::error::No ISO was produced by live-build!"
            exit 1
          fi
          echo "iso_file=$ISO_FILE" >> $GITHUB_OUTPUT
          sha256sum "$ISO_FILE" > "$ISO_FILE.sha256"

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: veyra-os-live-amd64
          path: |
            live-build/*.iso
            live-build/*.sha256
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v0.1.0-alpha
          name: "Veyra OS v0.1.0-alpha (Live USB)"
          body: |
            ## Veyra OS v0.1.0-alpha
            *A calmer way to compute.*

            ### 🚀 About this Build
            - **Base OS:** Debian 12 (Bookworm) `amd64`
            - **Desktop Environment:** KDE Plasma (Veyra Midnight Navy & Teal aesthetic)
            - **Window Controls:** Left-aligned macOS traffic lights (`Close, Minimize, Maximize`)
            - **Target:** HP Folio 13 & standard x86_64 PCs
            - **Mode:** Safe non-destructive Live USB (RAM overlay, internal disks untouched)
            - **Default User:** `veyra`

            ### 📥 Download & Verification
            Download `live-image-amd64.hybrid.iso` below and verify its checksum:
            ```bash
            sha256sum -c live-image-amd64.hybrid.iso.sha256
            ```
          files: |
            live-build/*.iso
            live-build/*.sha256
          draft: false
          prerelease: true
